<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ISE — Mobile App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg:#F5F3ED; --surface:#FFFFFF; --surface-2:#FBF9F4;
    --border:#E4DFD0; --border-strong:#D3CBB4;
    --ink:#242923; --ink-soft:#5C6359; --ink-faint:#8C9187;
    --navy:#1F2D3D; --navy-deep:#16212C; --navy-soft:#E7EAEE;
    --olive:#5B6B4F; --olive-soft:#E7EBDE; --olive-text:#41502F;
    --gold:#A9822F; --gold-soft:#F3E8CE; --gold-text:#7A5E1F;
    --charcoal:#6B6B66; --charcoal-soft:#E7E5DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;}
  a{color:var(--navy);text-decoration:none;cursor:pointer;} a:hover{color:var(--gold-text);}
  .disp{font-family:'Barlow Condensed',system-ui,sans-serif;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;}
  button{font-family:inherit;cursor:pointer;}
  .btn-primary{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;}
  .btn-secondary{background:transparent;border:1.5px solid var(--border-strong);color:var(--navy);border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:264px;flex:0 0 264px;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:26px 18px;}
  .navitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:500;color:#C7CFD8;border-left:3px solid transparent;}
  .navitem.active{background:rgba(255,255,255,0.08);color:#fff;border-left:3px solid var(--gold);}
  .navitem:hover{color:#fff;}
  .main-area{flex:1;min-width:0;}
  .topbar{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:var(--surface);}
  .content{padding:26px 30px 48px;}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  textarea{font-family:inherit;font-size:14px;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;width:100%;background:#fff;color:var(--ink);resize:vertical;}
  .avatar-add-btn{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;border:3px solid var(--surface);font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .avatar-add-btn:hover{background:var(--gold-text);}
  .edit-btn{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .edit-btn:hover{background:var(--navy-soft);color:var(--navy);}
  .edit-btn-inline{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 auto;}
  .edit-btn-inline:hover{background:var(--navy-soft);color:var(--navy);}
  .contact-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--ink);}
  .contact-pill:hover{background:var(--navy-soft);color:var(--navy);}
  .contact-pill-wa{background:#E7F5EC;color:#2F6B44;border-color:#CFE9D8;}
  .contact-pill-wa:hover{background:#D8EEE0;color:#2F6B44;}
  .modal-overlay{position:fixed;inset:0;background:rgba(22,33,44,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-box{background:var(--surface);border-radius:14px;padding:26px 26px 22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .post-action-btn{background:none;border:none;font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;padding:4px 0;}
  .post-action-btn:hover{color:var(--navy);}
  .post-action-btn.liked{color:var(--gold-text);}
  .tag-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:20;max-height:220px;overflow:auto;}
  .tag-suggestion-item{padding:8px 12px;font-size:13px;cursor:pointer;}
  .tag-suggestion-item:hover{background:var(--surface-2);}
  .notif-bell{position:relative;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;color:var(--ink-soft);flex:0 0 auto;}
  .notif-bell:hover{background:var(--navy-soft);color:var(--navy);}
  .notif-badge{background:#C0392B;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}
  .notif-badge-abs{position:absolute;top:2px;right:2px;}
  @media (max-width: 860px){ .sidebar{display:none;} }
</style>
</head>
<body>

<script>
// ============================================================
// ISE (In Service, Eternally) — Production Mobile App
// Realtime Multi-Device Sync & Firebase Family Registry.

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const ICONS = {
  home: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h5v-6h2v6h5V10"/></svg>`,

  user: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.3"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg>`,
  pencil: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  bell: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.5 1.5 6 1.5 6h-15s1.5-1.5 1.5-6Z"/><path d="M10 19.5a2 2 0 0 0 4 0"/></svg>`,
  pin: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.5 7-12.5A7 7 0 0 0 5 8.5C5 13.5 12 21 12 21Z"/><circle cx="12" cy="8.5" r="2.3"/></svg>`,
};

const STATUS_LABEL = { aktif_dinas: "Aktif Dinas", purnawirawan: "Purnawirawan", berpulang: "Berpulang" };
const STATUS_STYLE = {
  aktif_dinas: { bg: "var(--olive-soft)", color: "var(--olive-text)" },
  purnawirawan: { bg: "var(--gold-soft)", color: "var(--gold-text)" },
  berpulang: { bg: "var(--charcoal-soft)", color: "var(--charcoal)" },
};

const DATA = {
  currentUserId: null, 
  anggota: [
    { 
      id: "admin", nrp: "admin", nama: "Administrator Utama", pangkat: "Super Admin", 
      angkatan: 2022, korps: "Komando", status: "aktif_dinas", role: "admin", 
      keluargaAsuh: "PUSAT", isKeluargaAdmin: true, email: "admin@ise.mil.id", 
      noHp: "+62 800-0000-0000", password: "adminsecret", bio: "Administrator Resmi ISE Mobile", 
      tglDaftar: "14 September 2026" 
    }
  ],
  families: {},
  posts: [],
  notifications: {},
  guestbook: {},
  agenda: [],
};

window.SUPER_ADMIN_FILTER_KELUARGA = "ALL";

// Penyimpanan Lokal Browser Per-Perangkat
try {
  const localSaved = localStorage.getItem("ISE_APP_DATA_V2");
  if(localSaved) {
    const parsed = JSON.parse(localSaved);
    if(parsed.posts && Array.isArray(parsed.posts)) DATA.posts = parsed.posts;
    if(parsed.guestbook) DATA.guestbook = Object.assign(DATA.guestbook, parsed.guestbook);
    if(parsed.agenda && Array.isArray(parsed.agenda)) DATA.agenda = parsed.agenda;
    if(parsed.families) DATA.families = Object.assign(DATA.families, parsed.families);
    if(parsed.anggota && Array.isArray(parsed.anggota)) {
      parsed.anggota.forEach(newA => {
        if(!DATA.anggota.some(exist => exist.id === newA.id || (exist.nrp && newA.nrp && exist.nrp.trim().toLowerCase() === newA.nrp.trim().toLowerCase()))) {
          DATA.anggota.push(newA);
        }
      });
    }
  }
} catch(e){ console.error("Error loading local storage data:", e); }

function saveAppDataLocally() {
  try {
    localStorage.setItem("ISE_APP_DATA_V2", JSON.stringify({
      posts: DATA.posts,
      guestbook: DATA.guestbook,
      agenda: DATA.agenda,
      families: DATA.families,
      anggota: DATA.anggota
    }));
  } catch(e){}
}

function initials(nama){ return nama ? String(nama).trim().split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase() : "?"; }
function currentUser(){ return DATA.currentUserId ? DATA.anggota.find(a=>a.id===DATA.currentUserId) : null; }
function byId(id){ return DATA.anggota.find(a=>a.id===id); }
function displayName(a){ return a ? `${escapeHtml(a.pangkat)} ${escapeHtml(a.nama)}` : ""; }
const BULAN_INDO = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BULAN_INDO_SINGKAT = ["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"];
function formatTanggalIndo(iso){
  if(!iso || !iso.includes("-")) return iso || "-";
  const [y,m,d] = iso.split("-").map(Number);
  return `${d} ${BULAN_INDO[m-1]} ${y}`;
}
function navigate(hash){ location.hash = hash; }

// Helper Pengambilan Seluruh Keluarga Asuh Terdaftar di Server/Memori (Case Normalized)
window.getExistingKeluargaList = function(){
  const set = new Set();
  if(DATA.families) {
    Object.keys(DATA.families).forEach(f => {
      if(f && f !== "PUSAT") set.add(String(f).trim().toUpperCase());
    });
  }
  DATA.anggota.forEach(a => {
    if(a.keluargaAsuh && a.keluargaAsuh !== "PUSAT") set.add(String(a.keluargaAsuh).trim().toUpperCase());
  });
  return Array.from(set).sort();
};

window.updateRegistrationKeluargaDropdown = function(){
  const sel = document.getElementById("reg_keluargaSelect");
  if(!sel) return;
  const currentVal = sel.value;
  const familyList = getExistingKeluargaList();
  const showCustom = familyList.length === 0;

  let html = familyList.map(f => `<option value="${escapeHtml(f)}">Keluarga Asuh ${escapeHtml(f)}</option>`).join("");
  html += `<option value="__NEW__" ${showCustom ? 'selected' : ''}>➕ Buat Keluarga Asuh Baru (Tulis Manual)...</option>`;

  sel.innerHTML = html;
  if(familyList.includes(currentVal)) {
    sel.value = currentVal;
  }
};

window.getFilteredAnggota = function(){
  const u = currentUser();
  if(!u) return [];

  const uGroup = String(u.keluargaAsuh || '').trim().toUpperCase();

  if(u.role === 'admin'){
    if(window.SUPER_ADMIN_FILTER_KELUARGA && window.SUPER_ADMIN_FILTER_KELUARGA !== "ALL"){
      const selectedGroup = String(window.SUPER_ADMIN_FILTER_KELUARGA).trim().toUpperCase();
      return DATA.anggota.filter(a => 
        String(a.keluargaAsuh || '').trim().toUpperCase() === selectedGroup || a.role === 'admin'
      );
    }
    return DATA.anggota;
  }

  if(uGroup){
    return DATA.anggota.filter(a => 
      String(a.keluargaAsuh || '').trim().toUpperCase() === uGroup || a.role === 'admin'
    );
  }

  return DATA.anggota;
};

window.getFilteredPosts = function(){
  const u = currentUser();
  if(!u) return [];
  const allowedUserIds = new Set(getFilteredAnggota().map(a => a.id));
  return DATA.posts.filter(p => allowedUserIds.has(p.penulisId));
};

window.getFilteredAgenda = function(){
  const u = currentUser();
  if(!u) return [];

  if(u.role === 'admin'){
    if(window.SUPER_ADMIN_FILTER_KELUARGA && window.SUPER_ADMIN_FILTER_KELUARGA !== "ALL"){
      const selectedGroup = String(window.SUPER_ADMIN_FILTER_KELUARGA).trim().toUpperCase();
      return DATA.agenda.filter(ag => !ag.keluargaAsuh || String(ag.keluargaAsuh).trim().toUpperCase() === selectedGroup);
    }
    return DATA.agenda;
  }

  if(u.keluargaAsuh){
    const uGroup = String(u.keluargaAsuh).trim().toUpperCase();
    return DATA.agenda.filter(ag => !ag.keluargaAsuh || String(ag.keluargaAsuh).trim().toUpperCase() === uGroup);
  }

  return DATA.agenda;
};

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371; const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1); const dLng = toRad(lng2 - lng1);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function formatJarak(km){ return km < 1 ? `${Math.max(1, Math.round(km*1000))} m` : `${km.toFixed(1).replace(".", ",")} km`; }

function pushNotification(toId, notif){
  if(!DATA.notifications[toId]) DATA.notifications[toId] = [];
  DATA.notifications[toId].unshift(Object.assign({ id: "n"+Date.now(), waktu: "Baru saja", read: false }, notif));
}
const NOTIF_ICON = { tag: "🏷️", like: "🫡", comment: "💬", thread: "🔁" };

function showToast(text){
  let root = document.getElementById("toastRoot");
  if(!root){
    root = document.createElement("div"); root.id = "toastRoot";
    root.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;";
    document.body.appendChild(root);
  }
  const el = document.createElement("div");
  el.textContent = text;
  el.style.cssText = "background:var(--navy);color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;";
  root.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity = "1"; });
  setTimeout(()=>{ el.style.opacity = "0"; setTimeout(()=>el.remove(), 300); }, 2600);
}

let selectedTags = [];
let openCommentBoxes = new Set();

window.logoutUser = function(){
  localStorage.removeItem("ISE_SESSION_V2");
  DATA.currentUserId = null;
  showToast("Anda telah keluar dari akun.");
  navigate("#/login");
};

function shell(activeHref, headerHtml, bodyHtml){
  const u = currentUser();
  if(!u) {
    setTimeout(()=>navigate("#/login"), 10);
    return `<div style="padding:40px;text-align:center;color:var(--navy);">Mengalihkan ke halaman pendaftaran...</div>`;
  }

  const unread = (DATA.notifications[u.id]||[]).filter(n=>!n.read).length;
  
  const nav = [
    ["#/", "Beranda", ICONS.home],
    ["#/angkatan/"+u.angkatan, "Angkatan Saya — "+u.angkatan, ICONS.users],
    ["#/angkatan", "Direktori Anggota", ICONS.users],
    ["#/sekitar", "Keluarga di Sekitar", ICONS.pin],
    ["#/kenangan", "Ruang Kenangan", ICONS.candle],
    ["#/notifikasi", "Notifikasi", ICONS.bell]
  ];

  if(u.isKeluargaAdmin || u.role === 'admin') {
    nav.push(["#/keluarga", "🛡️ Kelola Kel. " + escapeHtml(u.keluargaAsuh || "Asuh"), ICONS.users]);
  }

  if (u.role === 'admin') {
    nav.push(["#/admin", "🛡️ Dashboard Super Admin", ICONS.user]);
  }

  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="disp" style="font-size:26px;font-weight:700;letter-spacing:3px;">ISE</div>
      <div style="font-size:10.5px;color:#93A0AE;margin-top:3px;letter-spacing:.6px;text-transform:uppercase;">In Service, Eternally</div>
      <nav style="margin-top:34px;display:flex;flex-direction:column;gap:3px;">
        ${nav.map(([href,label,icon])=>{
          const badge = href==='#/notifikasi' && unread>0 ? `<span class="notif-badge" style="margin-left:auto;">${unread>9?'9+':unread}</span>` : '';
          return `<a class="navitem${activeHref===href?' active':''}" onclick="navigate('${href}')">${icon}<span>${escapeHtml(label)}</span>${badge}</a>`;
        }).join("")}
        <a class="navitem${activeHref==='#/profil/'+u.id?' active':''}" onclick="navigate('#/profil/${u.id}')">${ICONS.user}<span>Profil Saya</span></a>
      </nav>
      <div style="margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;">
        <div class="avatar" style="width:38px;height:38px;background:#3A4A5C;color:#D9C486;font-size:13px;">${initials(u.nama)}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.pangkat)} ${escapeHtml(u.nama)}</div>
          <div style="font-size:11px;color:#93A0AE;">Kel. ${escapeHtml(u.keluargaAsuh||'-')} ${u.isKeluargaAdmin?'(Admin)':''}</div>
        </div>
        <a onclick="logoutUser()" style="color:#e74c3c;font-size:12px;font-weight:600;cursor:pointer;">Keluar 🚪</a>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div>${headerHtml}</div>
          ${u.role === 'admin' ? `
          <div style="display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border-strong);padding:4px 10px;border-radius:8px;">
            <span style="font-size:12px;font-weight:700;color:var(--navy);">Filter Kelompok:</span>
            <select onchange="window.SUPER_ADMIN_FILTER_KELUARGA=this.value;render();" style="font-size:12px;padding:3px 6px;border:none;background:transparent;font-weight:700;color:var(--gold-text);cursor:pointer;width:auto;">
              <option value="ALL" ${window.SUPER_ADMIN_FILTER_KELUARGA==='ALL'?'selected':''}>🌐 Semua Keluarga Asuh</option>
              ${getExistingKeluargaList().map(k => `<option value="${escapeHtml(k)}" ${window.SUPER_ADMIN_FILTER_KELUARGA===k?'selected':''}>🏠 Kel. Asuh ${escapeHtml(k)}</option>`).join("")}
            </select>
          </div>` : (u.keluargaAsuh ? `<span class="badge" style="background:var(--gold-soft);color:var(--gold-text);font-size:12px;">🏠 Kel. Asuh ${escapeHtml(u.keluargaAsuh)}</span>` : '')}

window.switchAuthTab = function(tab){
  const loginF = document.getElementById("loginForm");
  const regF = document.getElementById("registerForm");
  const btnL = document.getElementById("tabBtnLogin");
  const btnR = document.getElementById("tabBtnRegister");

  if(tab === 'login') {
    loginF.style.display = 'block'; regF.style.display = 'none';
    btnL.style.background = 'var(--navy)'; btnL.style.color = '#fff';
    btnR.style.background = 'transparent'; btnR.style.color = 'var(--ink-soft)';
  } else {
    loginF.style.display = 'none'; regF.style.display = 'block';
    btnR.style.background = 'var(--navy)'; btnR.style.color = '#fff';
    btnL.style.background = 'transparent'; btnL.style.color = 'var(--ink-soft)';
  }
};

window.togglePassView = function(id, pass){
  const el = document.getElementById("passText_" + id);
  if(!el) return;
  if(el.dataset.show === "true"){
    el.textContent = "••••••••";
    el.dataset.show = "false";
  } else {
    el.textContent = pass;
    el.dataset.show = "true";
  }
};

function safeRerenderBeranda(){
  const postInputEl = document.getElementById("postInput");
  const tagInputEl = document.getElementById("tagSearchInput");
  const draft = postInputEl ? postInputEl.value : "";
  const tagDraft = tagInputEl ? tagInputEl.value : "";
  render();
  const newPostInput = document.getElementById("postInput");
  const newTagInput = document.getElementById("tagSearchInput");
  if(newPostInput) newPostInput.value = draft;
  if(newTagInput) newTagInput.value = tagDraft;
}

function toggleLike(postId){
  const u = currentUser(); if(!u) return;
  const p = DATA.posts.find(x=>x.id===postId);
  if(!p) return;
  if(!p.likes) p.likes = [];
  const idx = p.likes.indexOf(u.id);
  if(idx>=0){ p.likes.splice(idx,1); } 
  else {
    p.likes.push(u.id);
    if(p.penulisId !== u.id){ pushNotification(p.penulisId, { type:"like", actorId: u.id, postId, text: `${displayName(u)} memberi hormat pada postingan Anda.` }); }
  }
  safeRerenderBeranda();
}

function toggleCommentBox(postId){
  if(openCommentBoxes.has(postId)) openCommentBoxes.delete(postId);
  else openCommentBoxes.add(postId);
  safeRerenderBeranda();
}

function submitComment(postId, actorId, text){
  const p = DATA.posts.find(x=>x.id===postId);
  if(!p) return;
  if(!p.comments) p.comments = [];
  const actor = byId(actorId);
  p.comments.push({ id: "c"+Date.now(), penulisId: actorId, isi: text, waktu: "Baru saja" });
  openCommentBoxes.add(postId);

  if(p.penulisId !== actorId){
    pushNotification(p.penulisId, { type:"comment", actorId, postId, text: `${displayName(actor)} mengomentari postingan Anda.` });
  }
  safeRerenderBeranda();
}

function addTag(id){
  const u = currentUser(); if(!u) return;
  if(!selectedTags.includes(id) && id !== u.id){ selectedTags.push(id); }
  const searchEl = document.getElementById("tagSearchInput");
  const suggEl = document.getElementById("tagSuggestions");
  if(searchEl) searchEl.value = "";
  if(suggEl){ suggEl.hidden = true; suggEl.innerHTML = ""; }
  renderTagChips();
}
function removeTagChip(id){ selectedTags = selectedTags.filter(t=>t!==id); renderTagChips(); }
function renderTagChips(){
  const el = document.getElementById("tagChips"); if(!el) return;
  el.innerHTML = selectedTags.map(id=>{
    const p = byId(id); if(!p) return "";
    return `<span class="badge" style="background:var(--navy-soft);color:var(--navy);">@${escapeHtml(p.nama)} <span style="cursor:pointer;margin-left:4px;" onclick="removeTagChip('${id}')">&times;</span></span>`;
  }).join("");
}

function handleFotoChange(e, id){
  const file = e.target.files && e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){ 
    const a = byId(id);
    if(a) {
      a.foto = ev.target.result; 
      saveAppDataLocally();
      if(window.updateUserInFirebase) window.updateUserInFirebase(a);
      render(); 
    }
  };
  reader.readAsDataURL(file);
}

          ${bodyHtml}
          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">
            <button type="button" class="btn-secondary" onclick="closeEditModal()">Batal</button>
            <button type="submit" class="btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>`;
  document.getElementById("editForm").addEventListener("submit", handleEditSubmit);
}

function closeEditModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function handleEditSubmit(e){
  e.preventDefault();
  const f = e.target; const id = f.dataset.id, section = f.dataset.section; const a = byId(id);
  if(!a) return;

  if(section === "profil"){
    a.bio = document.getElementById("edit_bio").value.trim();
    a.email = document.getElementById("edit_email").value.trim();
    a.noHp = document.getElementById("edit_noHp").value.trim();
    a.whatsapp = document.getElementById("edit_whatsapp").value.trim();
  } else if(section === "info"){
    a.jabatan = document.getElementById("edit_jabatan").value.trim();
    a.domisili = document.getElementById("edit_domisili").value.trim();
    a.nrp = document.getElementById("edit_nrp").value.trim();
  } else if(section === "karier"){
    const lines = document.getElementById("edit_karier").value.split("\n").map(s=>s.trim()).filter(Boolean);
    a.karier = lines.map(l=>l.split("|").map(s=>s.trim()));
  } else if(section === "prestasi"){
    const lines = document.getElementById("edit_prestasi").value.split("\n").map(s=>s.trim()).filter(Boolean);
    a.prestasi = lines.map(l=>l.split("|").map(s=>s.trim()));
  }
  closeEditModal();
  saveAppDataLocally();
  if(window.updateUserInFirebase) window.updateUserInFirebase(a);
  render();
}

let currentRadiusKm = 250;
function attachSekitar(){
  const btn = document.getElementById("btnCariSekitar");
  if(btn) btn.addEventListener("click", cariKeluargaSekitar);
  cariKeluargaSekitar();
}

function cariKeluargaSekitar(){
  const statusEl = document.getElementById("sekitarStatus");
  if(!navigator.geolocation){
    if(statusEl) statusEl.textContent = "GPS tidak didukung perangkat ini.";
    return;
  }
  if(statusEl) statusEl.textContent = "Meminta izin akses GPS...";
  navigator.geolocation.getCurrentPosition(
    pos => renderHasilSekitar(pos.coords.latitude, pos.coords.longitude),
    err => { if(statusEl) statusEl.textContent = `Gagal GPS (${err&&err.message?err.message:'Izin ditolak'}).`; },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function renderHasilSekitar(lat, lng){
  const statusEl = document.getElementById("sekitarStatus");
  const resultEl = document.getElementById("sekitarResult");
  if(statusEl) statusEl.textContent = "GPS Terdeteksi!";

  const nearby = getFilteredAnggota()
    .filter(a => a.id !== DATA.currentUserId && a.lokasi)
    .map(a => ({ a, km: haversineKm(lat, lng, a.lokasi.lat, a.lokasi.lng) }))
    .filter(x => x.km <= currentRadiusKm)
    .sort((x, y) => x.km - y.km);

  if(!nearby.length){
    resultEl.innerHTML = `<div class="card" style="padding:20px;font-size:13px;color:var(--ink-faint);">Tidak ada anggota keluarga di sekitar Anda dalam radius ${currentRadiusKm} km.</div>`;
    return;
  }
  resultEl.innerHTML = `<div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:10px;"><b>${nearby.length} anggota</b> terdeteksi:</div>` +
    nearby.map(({a, km}) => `
    <a onclick="navigate('#/profil/${a.id}')" class="card" style="display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink);">
      <div class="avatar" style="width:40px;height:40px;background:var(--navy-soft);color:var(--navy);font-size:13px;flex:0 0 auto;">${initials(a.nama)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13.5px;font-weight:700;">${escapeHtml(a.pangkat)} ${escapeHtml(a.nama)} <span style="font-weight:400;color:var(--ink-faint);">· Kel. ${escapeHtml(a.keluargaAsuh||'-')}</span></div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">📍 ${escapeHtml(a.lokasi.satuan || a.domisili || '')}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto;">
        <div style="font-size:13px;font-weight:700;color:var(--gold-text);">${formatJarak(km)}</div>
      </div>
    </a>`).join("");
}

            <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;">${pesanList.length} doa dan kenangan</div>
            <form id="pesanForm" data-id="${id}" style="display:flex;gap:10px;margin-bottom:20px;">
              <input id="pesanInput" placeholder="Tulis kenangan atau doa..." style="flex:1;border-radius:100px;">
              <button type="submit" class="btn-primary">Kirim</button>
            </form>
            <div style="display:flex;flex-direction:column;gap:16px;" id="pesanList">${pesanHtml}</div>
          </div>
        </div>
      </div>`);
}

function viewNotifikasi(){
  const u = currentUser(); if(!u) return viewLogin();
  const list = DATA.notifications[u.id] || [];
  const html = list.length ? list.map(n=>{
    const actor = byId(n.actorId); if(!actor) return "";
    return `<div class="card" style="padding:14px 18px;display:flex;gap:12px;align-items:flex-start;${n.read?'':'background:var(--gold-soft);border-color:transparent;'}">
      <a class="avatar" onclick="navigate('#/profil/${actor.id}')" style="width:36px;height:36px;background:var(--navy-soft);color:var(--navy);font-size:13px;flex:0 0 auto;">${initials(actor.nama)}</a>
      <div style="flex:1;">
        <div style="font-size:13.5px;line-height:1.5;">${escapeHtml(n.text)}</div>
        <div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px;">${escapeHtml(n.waktu)}</div>
      </div>
      <div style="font-size:16px;flex:0 0 auto;">${NOTIF_ICON[n.type]||'🔔'}</div>
    </div>`;
  }).join("") : `<div style="font-size:13px;color:var(--ink-faint);">Belum ada notifikasi.</div>`;

  list.forEach(n=>n.read=true);
  return shell("#/notifikasi", `<div class="disp" style="font-size:18px;font-weight:700;color:var(--navy);">Notifikasi</div>`, `
      <div style="max-width:640px;display:flex;flex-direction:column;gap:10px;">${html}</div>`);
}

function check30DaySession(){
  try {
    const sStr = localStorage.getItem("ISE_SESSION_V2");
    if(sStr) {
      const sess = JSON.parse(sStr);
      if(sess.userId && sess.expiresAt && sess.expiresAt > Date.now()) {
        const found = DATA.anggota.find(a => 
          a.id === sess.userId || 
          (a.nrp && sess.userId && a.nrp.trim().toLowerCase() === String(sess.userId).trim().toLowerCase())
        );
        if(found) { DATA.currentUserId = found.id; return true; }
      }
    }
  } catch(e){}
  DATA.currentUserId = null;
  return false;
}

function render(){
  saveAppDataLocally();
  const hasValidSession = check30DaySession();
  const hash = location.hash || "#/login";
  const parts = hash.replace("#/","").split("/").filter(Boolean);
  const app = document.getElementById("app");

  if(!hasValidSession || hash === "#/login" || parts[0] === "login"){
    DATA.currentUserId = null;
    app.innerHTML = viewLogin();
    attachLogin();
    return;
  }

  if(parts[0] === "admin"){
    const u = currentUser();
    if(!u || u.role !== 'admin'){ showToast("Akses Ditolak: Halaman khusus Super Administrator."); navigate("#/"); return; }
    app.innerHTML = viewAdmin();
    return;
  }
  if(parts[0] === "keluarga"){ app.innerHTML = viewKelolaKeluarga(); return; }
  if(parts.length === 0){ app.innerHTML = viewBeranda(); attachBeranda(); return; }
  if(parts[0] === "angkatan" && parts[1]){ app.innerHTML = viewAngkatanDetail(parts[1]); return; }
  if(parts[0] === "angkatan"){ app.innerHTML = viewAngkatanList(); return; }
  if(parts[0] === "profil" && parts[1]){ app.innerHTML = viewProfil(parts[1]); return; }
  if(parts[0] === "kenangan" && parts[1]){ app.innerHTML = viewKenanganDetail(parts[1]); attachKenangan(); return; }
  if(parts[0] === "kenangan"){ app.innerHTML = viewKenanganList(); return; }
  if(parts[0] === "notifikasi"){ app.innerHTML = viewNotifikasi(); return; }
  if(parts[0] === "agenda"){ app.innerHTML = viewAgenda(); return; }
  if(parts[0] === "sekitar"){ app.innerHTML = viewSekitar(); attachSekitar(); return; }
  app.innerHTML = viewBeranda(); attachBeranda();
}

function attachLogin(){
  const lf = document.getElementById("loginForm");
  if(lf) {
    lf.addEventListener("submit", e => {
      e.preventDefault();
      const uVal = document.getElementById("loginInputUser").value.trim().toLowerCase();
      const pVal = document.getElementById("loginInputPass").value.trim();

      const found = DATA.anggota.find(a => 
        (a.email && a.email.trim().toLowerCase() === uVal) ||
        (a.nrp && a.nrp.trim().toLowerCase() === uVal) ||
        (a.id && a.id.trim().toLowerCase() === uVal)
      );

      if(!found) { 
        showToast("Pengguna tidak ditemukan. Silakan mendaftar di tab Registrasi."); 
        return; 
      }
      if(found.password && found.password.trim() !== pVal) { 
        showToast("Kata sandi salah. Silakan periksa kembali."); 
        return; 
      }

      DATA.currentUserId = found.id;
      const remember30 = document.getElementById("chkRemember30").checked;
      if(remember30) {
        const expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000);
        localStorage.setItem("ISE_SESSION_V2", JSON.stringify({ userId: found.id, expiresAt }));
      } else {
        localStorage.removeItem("ISE_SESSION_V2");
      }

      saveAppDataLocally();
      showToast(`Selamat datang kembali, ${found.pangkat} ${found.nama}!`);
      if(found.role === 'admin') navigate("#/admin"); else navigate("#/");
    });
  }

  const rf = document.getElementById("registerForm");
  if(rf) {
    rf.addEventListener("submit", e => {
      e.preventDefault();
      const nama = document.getElementById("reg_nama").value.trim();
      const nrp = document.getElementById("reg_nrp").value.trim();
      const angkatan = Number(document.getElementById("reg_angkatan").value);
      const pangkat = document.getElementById("reg_pangkat").value;
      const korps = document.getElementById("reg_korps").value.trim();
      const status = document.getElementById("reg_status").value;
      const domisili = document.getElementById("reg_domisili").value.trim();
      const email = document.getElementById("reg_email").value.trim();
      const noHp = document.getElementById("reg_noHp").value.trim();
      const pass = document.getElementById("reg_pass").value.trim();

      const selKel = document.getElementById("reg_keluargaSelect").value;
      const custKel = document.getElementById("reg_keluargaCustom").value.trim();
      let rawKeluarga = selKel === '__NEW__' ? custKel : selKel;
      let finalKeluarga = rawKeluarga.trim().toUpperCase();

      if(!finalKeluarga) { showToast("Harap isi atau pilih Keluarga Asuh."); return; }
      if(!nama || !nrp || !email || !pass) { showToast("Harap isi semua bidang pendaftaran."); return; }
      
      if(DATA.anggota.some(a => (a.nrp && a.nrp.trim().toLowerCase() === nrp.toLowerCase()) || (a.email && a.email.trim().toLowerCase() === email.toLowerCase()))) { 
        showToast("NRP atau Email ini sudah terdaftar."); 
        return; 
      }

      const existingFamilyMembers = DATA.anggota.filter(a => String(a.keluargaAsuh||'').trim().toUpperCase() === finalKeluarga);
      const isKeluargaAdmin = existingFamilyMembers.length < 2;

      const id = "u_" + Date.now();
      const newUser = {
        id, nrp, nama, pangkat, angkatan, korps, status, domisili, email, noHp,
        password: pass, role: "user", keluargaAsuh: finalKeluarga, isKeluargaAdmin,
        tglDaftar: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }),
        bio: `Perwira Akmil ${angkatan}, Korps ${korps}. Member Kelompok ${finalKeluarga}.`
      };

      DATA.anggota.unshift(newUser);
      DATA.currentUserId = newUser.id;

      const expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000);
      localStorage.setItem("ISE_SESSION_V2", JSON.stringify({ userId: newUser.id, expiresAt }));
      saveAppDataLocally();

      if(window.publishUserToFirebase) { window.publishUserToFirebase(newUser); }
      if(window.publishFamilyToFirebase) { window.publishFamilyToFirebase(finalKeluarga); }

      showToast(`Pendaftaran Berhasil! ${pangkat} ${nama} terdaftar di Keluarga Asuh ${finalKeluarga}${isKeluargaAdmin ? ' (Admin Kelompok)' : ''}.`);
      navigate("#/");
    });
  }
}

function attachBeranda(){
  const f = document.getElementById("postForm");
  if(f) {
    f.addEventListener("submit", e=>{
      e.preventDefault();
      const u = currentUser(); if(!u) return;
      const input = document.getElementById("postInput");
      if(!input.value.trim()) return;
      const newPost = { id: "p"+Date.now(), penulisId: u.id, tipe: "manual", isi: input.value.trim(), waktu: "Baru saja", tags: [...selectedTags], likes: [], comments: [] };
      DATA.posts.unshift(newPost);
      if(window.publishPostToFirebase) window.publishPostToFirebase(newPost);
      selectedTags.forEach(tid=>{
        pushNotification(tid, { type: "tag", actorId: u.id, postId: newPost.id, text: `${displayName(u)} menandai Anda dalam sebuah postingan.` });
      });
      selectedTags = [];
      render();
    });
  }

  const tagInput = document.getElementById("tagSearchInput");
  if(tagInput) {
    tagInput.addEventListener("input", ()=>{
      const u = currentUser(); if(!u) return;
      const q = tagInput.value.trim().toLowerCase();
      const sugg = document.getElementById("tagSuggestions");
      if(!q){ sugg.hidden = true; sugg.innerHTML = ""; return; }
      const results = getFilteredAnggota().filter(a=>a.id!==u.id && !selectedTags.includes(a.id) && a.nama.toLowerCase().includes(q)).slice(0,6);
      if(!results.length){ sugg.hidden = true; sugg.innerHTML = ""; return; }
      sugg.innerHTML = results.map(a=>`<div class="tag-suggestion-item" onclick="addTag('${a.id}')">${escapeHtml(a.pangkat)} ${escapeHtml(a.nama)} <span style="color:var(--ink-faint);font-weight:400;">· Kel. ${escapeHtml(a.keluargaAsuh||'-')}</span></div>`).join("");
      sugg.hidden = false;
    });
  }

  renderTagChips();
  attachCommentForms();
}

function attachCommentForms(){
  document.querySelectorAll(".commentForm").forEach(f=>{
    f.addEventListener("submit", e=>{
      e.preventDefault();
      const u = currentUser(); if(!u) return;
      const postId = f.dataset.id;
      const input = f.querySelector("input");
      if(!input.value.trim()) return;
      submitComment(postId, u.id, input.value.trim());
    });
  });
}

function attachKenangan(){
  const f = document.getElementById("pesanForm"); if(!f) return;
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const u = currentUser(); if(!u) return;
    const id = f.dataset.id; const input = document.getElementById("pesanInput");
    if(!input.value.trim()) return;
    const entry = { penulis: u.pangkat+" "+u.nama, pesan: input.value.trim() };
    if(!DATA.guestbook[id]) DATA.guestbook[id] = [];
    DATA.guestbook[id].unshift(entry);
    if(window.publishGuestbookToFirebase) window.publishGuestbookToFirebase(id, entry);
    render();
  });
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered:', reg.scope))
      .catch(err => console.error('Service Worker Error:', err));
  });
}
</script>

<!-- FIREBASE REALTIME DATABASE MULTI-DEVICE SYNC ENGINE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://ise-app-585be-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ise-app-585be"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.firebaseDb = db;
    window.firebaseRef = ref;
    window.firebasePush = push;
    window.firebaseSet = set;

    console.log("🔥 Terhubung ke Firebase Realtime Database Sync Engine");

    // Simpan/Update Nama Kelompok Keluarga Asuh di Firebase
    window.publishFamilyToFirebase = function(familyName) {
      try { 
        const key = String(familyName).trim().toUpperCase();
        if(key) set(ref(db, 'ise/families/' + key), true); 
      } catch(e){ console.error("Gagal simpan kelompok ke Firebase:", e); }
    };

    // Simpan/Update Anggota di Firebase Realtime Database
    window.publishUserToFirebase = function(newUser) {
      try { 
        set(ref(db, 'ise/users/' + newUser.id), { ...newUser, timestamp: Date.now() }); 
        if(newUser.keluargaAsuh) window.publishFamilyToFirebase(newUser.keluargaAsuh);
      } catch(e){ console.error("Gagal simpan user ke Firebase:", e); }
    };

    window.updateUserInFirebase = function(userObj) {
      try { 
        set(ref(db, 'ise/users/' + userObj.id), { ...userObj, timestamp: Date.now() }); 
        if(userObj.keluargaAsuh) window.publishFamilyToFirebase(userObj.keluargaAsuh);
      } catch(e){ console.error("Gagal update user di Firebase:", e); }
    };

    window.publishPostToFirebase = function(newPost) {
      try { push(ref(db, 'ise/posts'), { ...newPost, timestamp: Date.now() }); } catch(e){}
    };

    window.publishGuestbookToFirebase = function(targetId, entry) {
      try { push(ref(db, 'ise/guestbook/' + targetId), { ...entry, timestamp: Date.now() }); } catch(e){}
    };

    // REALTIME LISTENER REGISTRY KELUARGA ASUH DARI FIREBASE
    onValue(ref(db, 'ise/families'), (snapshot) => {
      const val = snapshot.val();
      if(val) {
        if(!DATA.families) DATA.families = {};
        DATA.families = Object.assign(DATA.families, val);
        updateRegistrationKeluargaDropdown();
        saveAppDataLocally();
      }
    });

    // REALTIME LISTENER ANGGOTA TERDAFTAR DARI FIREBASE
    onValue(ref(db, 'ise/users'), (snapshot) => {
      const val = snapshot.val();
      if(val) {
        Object.keys(val).forEach(userId => {
          const uData = val[userId];
          if(uData && uData.id) {
            if(uData.keluargaAsuh) {
              const fKey = String(uData.keluargaAsuh).trim().toUpperCase();
              if(!DATA.families) DATA.families = {};
              DATA.families[fKey] = true;
            }
            const idx = DATA.anggota.findIndex(exist => 
              exist.id === uData.id || 
              (exist.nrp && uData.nrp && exist.nrp.trim().toLowerCase() === uData.nrp.trim().toLowerCase()) ||
              (exist.email && uData.email && exist.email.trim().toLowerCase() === uData.email.trim().toLowerCase())
            );
            if(idx >= 0) {
              DATA.anggota[idx] = Object.assign({}, DATA.anggota[idx], uData);
            } else {
              DATA.anggota.push(uData);
            }
          }
        });
        updateRegistrationKeluargaDropdown();
        saveAppDataLocally();
        if(typeof render === 'function') render();
      }
    });

    // REALTIME LISTENER POSTINGAN
    onValue(ref(db, 'ise/posts'), (snapshot) => {
      const val = snapshot.val();
      if(val) {
        const list = Object.keys(val).map(k => ({ id: k, ...val[k] }));
        list.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
        DATA.posts = list;
        if(typeof render === 'function') render();
      }
    });

  } catch(err) {
    console.error("Kesalahan Firebase Sync:", err);
  }
</script>
</body>
